name: Android CI & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Test Joyverse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" "build-tools;36.0.0"
          else
            echo "::warning::sdkmanager not found at $SDKMANAGER"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Robolectric Maven Artifacts
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Debug Keystore & Environment
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          : > .env

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Dump CI Failure Diagnostics
        if: failure()
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Android SDK Platforms & Build Tools ==="
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" "$SDK_ROOT/licenses" 2>&1 || true
          echo "=== Test XML Results (if any) ==="
          if [ -d app/build/test-results/testDebugUnitTest ]; then
            ls -la app/build/test-results/testDebugUnitTest
            cat app/build/test-results/testDebugUnitTest/*.xml || true
          else
            echo "No test-results XML directory produced (failure occurred prior to or during test executor startup)."
          fi

      - name: Check Generated Artifacts
        id: artifacts
        if: always()
        run: |
          if [ -d app/build/reports/tests/testDebugUnitTest ] && [ -n "$(ls -A app/build/reports/tests/testDebugUnitTest 2>/dev/null)" ]; then
            echo "has_test_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_test_reports=false" >> "$GITHUB_OUTPUT"
          fi
          if ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
            echo "has_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_apk=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Debug APK Artifact
        if: success() && steps.artifacts.outputs.has_apk == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: joyverse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Test Results
        if: always() && steps.artifacts.outputs.has_test_reports == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
